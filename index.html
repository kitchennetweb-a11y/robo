<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">

const PH = Object.fromEntries((await (await fetch('phrases.json')).json()).map(p => [p.id, p]));

const $ = id => document.getElementById(id);

// ---------- stats (parent area) ----------

// ---------- scene ----------
const r = new THREE.WebGLRenderer({ antialias: true });

const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(38, 1, .1, 50);
const DAY = new THREE.Color(0xf6e7d8), NIGHT = new THREE.Color(0x2b3050);
scene.background = DAY.clone();
const hemi = new THREE.HemisphereLight(0xfff4e8, 0xc8b8a8, 2.2), sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(1.5, 3, 2); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -2.5, right: 2.5, top: 2.5, bottom: -2.5 });

// room from primitives; props carry userData.hit so taps on them become events
const props = [];
function box(w, h, d, color, x, y, z, hit) {

box(10, .02, 8, 0xe9d5c0, 0, -.01, 0);                 // floor
box(10, 5, .05, 0xcfe3ef, 0, 2.5, -1.8);               // back wall
box(1.3, .9, .03, 0xffffff, .9, 1.7, -1.77);           // window frame
box(1.15, .75, .03, 0xaedcf5, .9, 1.7, -1.75);         // window glass
const rug = new THREE.Mesh(new THREE.CircleGeometry(.85, 48), new THREE.MeshStandardMaterial({ color: 0xf3b6c3 }));
rug.rotation.x = -Math.PI / 2; rug.position.y = .002; rug.receiveShadow = true; scene.add(rug);
box(1.1, .28, .65, 0x8fb3d9, -1.65, .14, -.8, 'bed');  // bed
box(1.05, .1, .6, 0xffffff, -1.65, .33, -.8, 'bed');
box(.3, .09, .42, 0xffe08a, -2.05, .42, -.8, 'bed');
box(.08, .65, .65, 0x8fb3d9, -2.2, .33, -.8, 'bed');
box(.4, .62, .34, 0x5b5f7a, 1.65, .31, -.7, 'speaker'); // speaker
for (const [y, rad] of [[.44, .1], [.2, .07]]) {
  const c = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad, .02, 24), new THREE.MeshStandardMaterial({ color: 0x2a2d3f }));
  c.rotation.x = Math.PI / 2; c.position.set(1.65, y, -.52); c.userData.hit = 'speaker'; scene.add(c); props.push(c);
}
// toy rocket on the floor: tap it and Robo blasts off
const rocketToy = new THREE.Group(); rocketToy.rotation.y = -.4; scene.add(rocketToy);
rocketToy.position.set(.85, 0, .1);  // beside Robo, behind the ball's fence (z .35) so the ball never hits it
function part(geo, color, x, y, z) {
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, roughness: .5 }));
  m.position.set(x, y, z); m.castShadow = true; m.userData.hit = 'rocket'; rocketToy.add(m); props.push(m); return m;
}
part(new THREE.CylinderGeometry(.06, .06, .26, 16), 0xffffff, 0, .17, 0);
part(new THREE.ConeGeometry(.06, .12, 16), 0xe8454a, 0, .36, 0);
part(new THREE.SphereGeometry(.025, 12, 8), 0x6fc3ff, 0, .22, .055);
for (let i = 0, a = 0; i < 3; i++, a += Math.PI * 2 / 3)  // fins
  part(new THREE.BoxGeometry(.02, .1, .07), 0xe8454a, Math.sin(a) * .06, .07, Math.cos(a) * .06).rotation.y = a;

// ball: flick or tap it; rolls with friction, bounces off walls/Robo/rocket; Robo kicks it back when idle
const BALL_R = .09, ballV = new THREE.Vector3(), rollAxis = new THREE.Vector3();
const stripes = Object.assign(document.createElement('canvas'), { width: 128, height: 64 }), sc = stripes.getContext('2d');
['#e8454a', '#ffd23f', '#3fa7ff', '#ffffff'].forEach((c, i) => { sc.fillStyle = c; sc.fillRect(i * 32, 0, 32, 64); });
const ball = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 24, 16),
  new THREE.MeshStandardMaterial({ map: Object.assign(new THREE.CanvasTexture(stripes), { colorSpace: THREE.SRGBColorSpace }), roughness: .4 }));
ball.position.set(-.4, BALL_R, .8); ball.castShadow = true; ball.userData.hit = 'ball'; scene.add(ball); props.push(ball);
// bubble bottle: tap it for a stream of bubbles the child can pop
const BOTTLE = new THREE.Vector3(-1, 0, -.2), bottle = new THREE.Group(); bottle.position.copy(BOTTLE); scene.add(bottle);
for (const [geo, color, y] of [[new THREE.CylinderGeometry(.05, .055, .15, 20), 0xff8fc8, .075], [new THREE.CylinderGeometry(.03, .03, .04, 16), 0x9a6bff, .17],
  [new THREE.CylinderGeometry(.005, .005, .12, 6), 0x9a6bff, .25], [new THREE.TorusGeometry(.035, .007, 8, 24), 0x9a6bff, .33]]) {
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, roughness: .4 }));
  m.position.y = y; m.castShadow = true; m.userData.hit = 'bubbles'; bottle.add(m); props.push(m);
}
const bubbles = [], bubbleGeo = new THREE.SphereGeometry(1, 20, 14);
const bubbleMat = new THREE.MeshPhysicalMaterial({ color: 0xcfefff, transparent: true, opacity: .35, roughness: 0, iridescence: 1, iridescenceIOR: 1.3, emissive: 0x335566, depthWrite: false });
function blowBubbles() {
  for (let i = 0; i < 16; i++) setTimeout(() => {
    const b = new THREE.Mesh(bubbleGeo, bubbleMat.clone()), size = .035 + Math.random() * .045;
    b.scale.setScalar(size); b.position.set(BOTTLE.x, .34, BOTTLE.z); b.material.color.setHSL(Math.random(), .8, .82);  // pastel tint
    b.userData = { size, t0: performance.now(), life: 7000 + Math.random() * 4000, ph: Math.random() * 6,
      v: new THREE.Vector3(.1 + Math.random() * .2, .04 + Math.random() * .07, (Math.random() - .5) * .2) };  // slow rise: stays tappable
    scene.add(b); bubbles.push(b);

  scene.remove(b); b.material.dispose(); bubbles.splice(bubbles.indexOf(b), 1);
  if (!sound) return;

  for (let i = 0; i < 4; i++) puff(b.position, 0xffffff, new THREE.Vector3((Math.random() - .5) * .6, (Math.random() - .5) * .6, (Math.random() - .5) * .6), 300);
}
const headPos = new THREE.Vector3(), bodyPos = new THREE.Vector3();
function stepBubbles(dt, now) {
  head.getWorldPosition(headPos); body.getWorldPosition(bodyPos);
  for (const b of [...bubbles]) {
    const u = b.userData, age = (now - u.t0) / 1000;
    b.position.addScaledVector(u.v, dt); b.position.x += Math.sin(age * 1.7 + u.ph) * .1 * dt;  // float and sway
    b.scale.set(u.size * (1 + .06 * Math.sin(age * 6 + u.ph)), u.size * (1 - .06 * Math.sin(age * 6 + u.ph)), u.size);
    if (b.position.distanceTo(headPos) < .25 + u.size || b.position.distanceTo(bodyPos) < .2) popBubble(b);  // floated into Robo

// peekaboo blanket: folded on the floor; tap -> it drops over Robo; tap again (or wait) -> it flies off, Robo pops out
const starsCv = Object.assign(document.createElement('canvas'), { width: 256, height: 128 }), stc = starsCv.getContext('2d');
stc.fillStyle = '#7cc6ff'; stc.fillRect(0, 0, 256, 128); stc.fillStyle = '#fff3a6';
for (let i = 0; i < 45; i++) { stc.beginPath(); stc.arc((i * 97) % 256, (i * 53) % 128, 5, 0, 7); stc.fill(); }
const blanket = new THREE.Mesh(
  new THREE.LatheGeometry([[.001, 1.02], [.16, 1], [.28, .92], [.34, .72], [.36, .4], [.39, .12], [.44, .02]].map(([x, y]) => new THREE.Vector2(x, y)), 32),
  new THREE.MeshStandardMaterial({ map: Object.assign(new THREE.CanvasTexture(starsCv), { colorSpace: THREE.SRGBColorSpace }), side: THREE.DoubleSide, roughness: .9 }));
blanket.castShadow = true; blanket.userData.hit = 'peek'; scene.add(blanket); props.push(blanket);
const FOLDED = { p: new THREE.Vector3(-.55, 0, .1), s: new THREE.Vector3(.45, .1, .45) }, OVER = { p: new THREE.Vector3(), s: new THREE.Vector3(1, 1, 1) };
blanket.position.copy(FOLDED.p); blanket.scale.copy(FOLDED.s);
let blanketMove = null, peekTimer;
function moveBlanket(to, dur) { blanketMove = { p: blanket.position.clone(), s: blanket.scale.clone(), to, t0: performance.now(), dur }; }
function stepBlanket(now) {
  if (!blanketMove) { if (st.mode === 'hide') blanket.scale.y = 1 + .025 * Math.sin(now / 300); return; }  // Robo "breathing" under it
  const u = Math.min((now - blanketMove.t0) / blanketMove.dur, 1), e = u * u * (3 - 2 * u);
  blanket.position.lerpVectors(blanketMove.p, blanketMove.to.p, e); blanket.position.y += Math.sin(Math.PI * u) * .7;  // arc through the air

}
// cup for the Drink clip, held in the right palm: white milk cup or clear water glass
const cup = new THREE.Mesh(new THREE.CylinderGeometry(.036, .03, .1, 20), new THREE.MeshStandardMaterial({ roughness: .3, transparent: true }));
cup.visible = false; cup.castShadow = true;
const CUPS = { milk: [0xffffff, 1], water: [0x9fd8ff, .55] };
const setCup = kind => { cup.material.color.set(CUPS[kind][0]); cup.material.opacity = CUPS[kind][1]; };
const OBSTACLES = [{ x: 0, z: 0, r: .3, robo: true }];  // rocket and bottle sit behind the ball's fence
let kickCool = 0;
function stepBall(dt, now) {
  ball.position.addScaledVector(ballV, dt); ballV.multiplyScalar(Math.max(0, 1 - 1.2 * dt));
  for (const [ax, lo, hi] of [['x', -1.15, 1.3], ['z', .35, 1.1]]) {  // play area: in front of Robo only, so it's always visible
    if (ball.position[ax] < lo) { ball.position[ax] = lo; ballV[ax] = Math.abs(ballV[ax]) * .7; }
    if (ball.position[ax] > hi) { ball.position[ax] = hi; ballV[ax] = -Math.abs(ballV[ax]) * .7; }
  }
  for (const o of OBSTACLES) {
    const dx = ball.position.x - o.x, dz = ball.position.z - o.z, d = Math.hypot(dx, dz), min = o.r + BALL_R;
    if (d > min + .002 || d === 0) continue;  // (resting contact counts, so a waiting ball gets kicked later)

    if (o.robo) {  // ball reached Robo: kick it back, or wait at his feet until he's free
      ballV.set(0, 0, 0);
      if (st.mode === 'idle' && now > kickCool) { kickCool = now + 600; dispatch({ type: 'ball' }); }
      continue;
    }
    const vn = ballV.x * nx + ballV.z * nz; if (vn < 0) { ballV.x -= 1.7 * vn * nx; ballV.z -= 1.7 * vn * nz; }

}

// ---------- robot ----------
const gltf = await new GLTFLoader().loadAsync('robo.glb');
const robot = gltf.scene; scene.add(robot); robot.rotation.order = 'YXZ';  // yaw, then bank (rocket loop)
// rocket loop around the room: an ellipse that starts and ends where Robo stands (right, round the back, left, home).

let orbit = null;
const LOOP_X = 1.25, LOOP_Z = .65;
function stepOrbit(now) {

  const turn = Math.min(u / .12, (1 - u) / .12, 1);  // 0 at the ends (facing the child), 1 in flight

  robot.rotation.set(0, Math.atan2(LOOP_X * Math.cos(th), -LOOP_Z * Math.sin(th)) * turn, -.3 * turn);

}
robot.traverse(o => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
const bone = n => robot.getObjectByName(n);
const head = bone('DEF-Head'), body = bone('DEF-Body'), handR = bone('DEF-handR');
// hand-local frame (measured): fingers +Y, palm faces -X, thumb +Z -> cup sits in the palm, standing across it, rim on the thumb side
handR.add(cup); cup.position.set(-.045, .04, 0); cup.rotation.x = Math.PI / 2;
const mixer = new THREE.AnimationMixer(robot);
const clips = Object.fromEntries(gltf.animations.map(c => [c.name, mixer.clipAction(c)]));
let cur;
function playClip(name, loop) {
  const a = clips[name]; if (!a) return console.warn('missing clip', name);
  a.reset(); a.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce); a.clampWhenFinished = !loop;
  if (cur && cur !== a) a.crossFadeFrom(cur, .25, false);

}

// face = texture swap on the eye and mouth materials
let eyeMat, mouthMat;
robot.traverse(o => { if (o.material?.name === 'mat_bot_1_eye') eyeMat = o.material; if (o.material?.name === 'mat_bot_mouth') mouthMat = o.material; });

for (const n of [...Object.values(FACES).flat(), 'eye_blink', 'mouth_A', 'mouth_O']) faceTex(n);

zone('DEF-Head', 'head', .15, .21); zone('DEF-Body', 'belly', .24, .15); zone('DEF-Body', 'foot', .06, .12);
zone('Antenna_Spring', 'antenna', .17, .09); zone('DEF-handL', 'hand', .03, .08); zone('DEF-handR', 'hand', .03, .08);
for (const s of 'LR') { zone(`DEF-upper_arm${s}`, 'arm', .06, .06); zone(`DEF-forearm${s}`, 'arm', .05, .055); }

// ---------- audio ----------

// ---------- effects ----------
const puffs = [], puffGeo = new THREE.SphereGeometry(.06, 10, 8);
function puff(pos, color, v, life) {  // soft ball that drifts, grows and fades (fart cloud, rocket smoke)
  const m = new THREE.Mesh(puffGeo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .5, depthWrite: false }));
  m.position.copy(pos); m.userData = { v, life, t0: performance.now() }; scene.add(m); puffs.push(m);
}
function fart() {
  tone('sawtooth', 95, 45, .75, .7, 600, 25);
  for (let i = 0; i < 8; i++) puff(new THREE.Vector3((Math.random() - .5) * .2, .12 + Math.random() * .1, -.22), 0x9bd36a,
    new THREE.Vector3((Math.random() - .5) * .4, .2 + Math.random() * .25, -.25), 1300);
}
function zzz() {
  const p = new THREE.Vector3(); head.getWorldPosition(p); p.y += .35; p.project(cam);
  const z = Object.assign(document.createElement('div'), { className: 'z', textContent: '💤' });
  z.style.left = (p.x + 1) / 2 * innerWidth + 'px'; z.style.top = (1 - p.y) / 2 * innerHeight + 'px';
  document.body.append(z); setTimeout(() => z.remove(), 2700);
}
const FX = {
  fart, bubbles: blowBubbles, milk: () => setCup('milk'), water: () => setCup('water'),
  blanketOn() { moveBlanket(OVER, 700); clearTimeout(peekTimer); peekTimer = setTimeout(() => dispatch({ type: 'peek' }), 7000); },
  blanketOff() { clearTimeout(peekTimer); moveBlanket(FOLDED, 900); },
  music: () => music(true), musicOff: () => music(false),
  flyTimer: () => setTimeout(() => dispatch({ type: 'flyEnd' }), 3500),
  orbit: () => orbit = { t0: performance.now(), dur: 5500 },
  kickBall: () => setTimeout(() => { const a = (Math.random() - .5) * 1.2; ballV.set(Math.sin(a), 0, Math.cos(a)).multiplyScalar(2.2); }, 150),  // straight back toward the screen (±35°)
  night() {
    scene.background.copy(NIGHT); hemi.intensity = .5; sun.intensity = .25;
    snoreTimer = setInterval(() => { tone('sawtooth', 75, 60, 1.3, .12, 300, 6); zzz(); }, 3200);
  },
  day() { scene.background.copy(DAY); hemi.intensity = 2.2; sun.intensity = 2.2; clearInterval(snoreTimer); },
};

// ---------- game loop glue ----------
const st = S0();
function dispatch(ev) { const a = step(st, ev); if (a) run(a); }
function run(a) {
  const go = () => {
    if (a.clip) playClip(a.clip, a.loop);
    if (a.face) face = a.face;
    if (a.fx) FX[a.fx]();
    const wait = a.sfx ? sfx(a.sfx) : 0;  // let the sound effect finish before talking
    if (a.say) setTimeout(() => say(a.say), Math.min(wait, 2500));
  };
  a.delay ? setTimeout(go, a.delay) : go();
}

// ---------- input ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), look = new THREE.Vector2(), lookNow = new THREE.Vector2();
let lastUser = performance.now(), lastSilly = 0, lastLonely = 0, boredAfter = 40000, greeted = false, down = null;
function hitAt(x, y) {
  ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1); ray.setFromCamera(ndc, cam);
  return ray.intersectObjects([...zones, ...props], false)[0];
}
function unlock() {
  if (ac.state !== 'running') ac.resume();
  lastUser = performance.now();
  if (!greeted && clips.Idle) { greeted = true; dispatch({ type: 'greet' }); }
}
r.domElement.addEventListener('pointerdown', e => {
  unlock(); down = { x: e.clientX, y: e.clientY };
  look.set((e.clientX / innerWidth - .5) * 1.0, (e.clientY / innerHeight - .5) * .6);
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, cam);
  const gap = b => ray.ray.distanceToPoint(b.position) - b.userData.size;  // closest bubble to the finger, generous reach
  const bub = bubbles.filter(b => gap(b) < .07).sort((a, b) => gap(a) - gap(b))[0];
  if (bub) { popBubble(bub); down = null; return; }
  if (ray.ray.distanceToPoint(ball.position) < BALL_R + .07) {  // tap the ball (generous reach): it rolls to Robo's feet
    ballV.set(-ball.position.x, 0, .37 - ball.position.z);  // aim just in front of him (the fence keeps it from going behind)
    ballV.setLength(Math.max(1.2, ballV.length() * 1.2 + .5)); down = null;  // friction 1.2/s: enough speed to always arrive
  }
});
r.domElement.addEventListener('pointerup', e => {
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y, h = hitAt(down.x, down.y); down = null;
  if (!h) return;
  let z = h.object.userData.hit;
  if (['bed', 'speaker', 'rocket', 'bubbles', 'peek'].includes(z)) return dispatch({ type: z });  // room toys
  if (dy < -80) return dispatch({ type: 'swipeUp' });
  if ((z === 'head' || z === 'antenna') && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) return dispatch({ type: 'headSwipe' });
  const hp = new THREE.Vector3(); head.getWorldPosition(hp);
  if (z === 'head' && h.point.z > hp.z + .1 && h.point.y < hp.y + .25) z = 'face';  // front of the head = the screen face
  dispatch({ type: 'tap', zone: z });
});

// food tray: drag onto Robo to feed, tap to hear the word
function nearRobot(x, y) {
  const p = new THREE.Vector3(); body.getWorldPosition(p); p.y += .35; p.project(cam);
  return Math.hypot((p.x + 1) / 2 * innerWidth - x, (1 - p.y) / 2 * innerHeight - y) < Math.min(innerWidth, innerHeight) * .25;
}
for (const [food, f] of Object.entries(FOOD)) {
  const el = Object.assign(document.createElement('span'), { className: 'food', textContent: f.emoji });
  $('tray').append(el);
  el.addEventListener('pointerdown', e => {
    unlock(); e.preventDefault();
    const g = Object.assign(document.createElement('div'), { className: 'drag', textContent: f.emoji }), x0 = e.clientX, y0 = e.clientY;
    document.body.append(g);
    const mv = e => { g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px'; }; mv(e);
    const up = e => {
      removeEventListener('pointermove', mv); removeEventListener('pointerup', up); g.remove();
      if (Math.hypot(e.clientX - x0, e.clientY - y0) < 15) return say(f.say[0]);
      if (nearRobot(e.clientX, e.clientY)) dispatch({ type: 'feed', food });
    };
    addEventListener('pointermove', mv); addEventListener('pointerup', up);
  });
}

// talk-back: listen, record until quiet, play back as a squeaky robot
const TH = .04;  // ponytail: mic loudness gate, tune on the real iPad if it triggers too easily / never
let mic, an, td, rec, recMime, chunks, recT0, loudT;
$('ear').onclick = async () => {
  unlock();
  if (mic) { mic.getTracks().forEach(t => t.stop()); mic = null; $('ear').classList.remove('on'); return; }
  try { mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); } catch { return; }
  an = ac.createAnalyser(); an.fftSize = 1024; td = new Float32Array(1024);
  ac.createMediaStreamSource(mic).connect(an); $('ear').classList.add('on'); sfx('listen');
};
function listen(now) {
  if (!mic || st.mode === 'sleep') return;
  an.getFloatTimeDomainData(td);
  let sum = 0; for (const v of td) sum += v * v;
  const loud = Math.sqrt(sum / td.length) > TH;
  if (!rec) {
    if (loud && now > audioBusyUntil) {
      chunks = []; rec = new MediaRecorder(mic); recMime = rec.mimeType;
      rec.ondataavailable = e => chunks.push(e.data); rec.onstop = playBack; rec.start(); recT0 = loudT = now; face = 'surprised';
    }
    return;
  }
  if (loud) loudT = now;
  if (now - loudT > 800 || now - recT0 > 6000) { rec.stop(); rec = null; }
}
async function playBack() {
  const b = await ac.decodeAudioData(await new Blob(chunks, { type: recMime }).arrayBuffer()).catch(() => null);
  if (!b || b.duration < .3) return;
  face = 'joy'; talkUntil = performance.now() + playBuf(b, 1.45);
  stats.spoken++; save();
}

// parent area: hold the top-left corner for 3 seconds
let pressT;
$('corner').onpointerdown = () => pressT = setTimeout(openParent, 3000);
$('corner').onpointerup = $('corner').onpointerleave = () => clearTimeout(pressT);
function openParent() {
  const heard = Object.entries(stats.words).sort((a, b) => b[1] - a[1]);
  const notYet = Object.keys(PH).filter(id => !stats.words[id]).length;
  $('parent').innerHTML = `<h2>Robo — parents</h2>
    <p>Minutes played: <b>${stats.minutes}</b> · Robot repeats (mic): <b>${stats.spoken}</b> · Phrases not heard yet: <b>${notYet}</b> of ${Object.keys(PH).length}</p>
    <p><button id="close">Close</button><button id="reset">Reset stats</button></p>
    <table>${heard.map(([id, n]) => `<tr><td dir="rtl">${PH[id]?.fa}</td><td>${PH[id]?.en}</td><td>${n}×</td></tr>`).join('')}</table>`;
  $('parent').style.display = 'block';
  $('close').onclick = () => $('parent').style.display = 'none';
  $('reset').onclick = () => { if (confirm('Reset all stats?')) { localStorage.removeItem('robo'); location.reload(); } };
}

// ---------- frame loop ----------
const clock = new THREE.Clock(), lookQ = new THREE.Quaternion(), lookE = new THREE.Euler();
playClip('Idle', true);
const frame = () => {
  const dt = Math.min(clock.getDelta(), .1), now = performance.now();
  mixer.update(dt);
  // head follows the last touch while idle, drifting back to centre after a few seconds
  if (now - lastUser > 3000) look.set(0, 0);
  stepBall(dt, now);
  stepBubbles(dt, now); stepBlanket(now);
  cup.visible = cur?.getClip().name === 'Drink';
  if (bubbles.length && st.mode === 'idle') { const p = bubbles[0].position.clone().project(cam); look.set(p.x * .5, -p.y * .3); }  // watch the bubbles
  if (ballV.lengthSq() > .04) { const p = ball.position.clone().project(cam); look.set(p.x * .5, -p.y * .3); }  // watch the rolling ball
  lookNow.lerp(st.mode === 'idle' ? look : look.clone().set(0, 0), .08);
  head.quaternion.multiply(lookQ.setFromEuler(lookE.set(lookNow.y, lookNow.x, 0)));
  applyFace(now);
  const clipName = cur?.getClip().name, bp = body.getWorldPosition(new THREE.Vector3());
  stepOrbit(now);
  flame.visible = (clipName === 'RocketLaunch' && cur.time > .35) || clipName === 'RocketFly' || (clipName === 'RocketLand' && bp.y > .05);
  cam.position.x = 0;
  if (flame.visible) {
    flame.scale.set(.85 + Math.random() * .3, .75 + Math.random() * .5, .85 + Math.random() * .3);
    cam.position.x = (Math.random() - .5) * .015;  // light shake
    if (Math.random() < .6) puff(bp.clone().setY(bp.y - .2), 0xcfcfcf, new THREE.Vector3((Math.random() - .5) * .8, -.2, (Math.random() - .5) * .8), 1000);
  }
  for (let i = puffs.length - 1; i >= 0; i--) {
    const m = puffs[i], age = (now - m.userData.t0) / m.userData.life;
    if (age > 1) { scene.remove(m); m.material.dispose(); puffs.splice(i, 1); continue; }
    m.position.addScaledVector(m.userData.v, dt); m.scale.setScalar(1 + age * 3); m.material.opacity = .5 * (1 - age);
  }
  listen(now);
  if (st.mode === 'idle' && greeted) {  // no touches for 2 min -> bored.mp3; meanwhile a random silly every 30-60 s
    if (now - Math.max(lastUser, lastLonely) > 120000) { lastLonely = now; dispatch({ type: 'lonely' }); }
    else if (now - Math.max(lastUser, lastSilly) > boredAfter) { lastSilly = now; boredAfter = 30000 + Math.random() * 30000; dispatch({ type: 'bored' }); }
  }
  r.render(scene, cam);
};
r.setAnimationLoop(frame);

if ('serviceWorker' in navigator && location.hostname !== 'localhost') navigator.serviceWorker.register('sw.js');
window.robo = { dispatch, st, ball, ballV, bubbles, cam, stepBall, blanket, stepBlanket, frame, cup, head, render: () => r.render(scene, cam), hit: (x, y) => hitAt(x, y)?.object.userData.hit, pose: (n, t) => { playClip(n, false); cur.time = t; cur.paused = true; } };  // console helpers
</script>
</body>
</html>
